# Publishes a GitHub release for a tag that exists already, by hand: Actions, "GitHub release", Run workflow, and
# the tag (v0.1.0-alpha.1). Its notes are that version's section of docs/CHANGELOG.md, read from the branch the
# workflow is run on (main), so the notes can be corrected after the tag was made.
#
# A new tag doesn't need this: release.yml publishes its GitHub release after the packages are on NuGet.
name: GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: write   # creating a release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: ./.github/github-release.ps1 $env:TAG
