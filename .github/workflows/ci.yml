# Builds, runs the unit tests and the consumer test on a push to main and on a pull request
# (docs/DESIGN.md, "Publishing", decisions 4 and 9), unless only documentation changed: see `paths` below.
#
# Not here: the rendering tests. Their references are exact Direct3D 12 pictures from a real GPU, and the hosted
# runners have only a software one; they run on the development machine before each milestone.
name: CI

# The `paths` lists (the same twice: a push and a pull request each need their own) leave out a change that is
# documentation only. A later pattern wins over an earlier one, so: everything; not docs/; but the two files in
# docs/ that are packed into every package; not the two documents at the root. One file that still matches is
# enough to run, so a push with code and documentation runs. "Run workflow" on the Actions page always runs.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/PACKAGE.md'
      - 'docs/THIRD-PARTY-NOTICES.md'
      - '!CLAUDE.md'
      - '!LICENSE'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/PACKAGE.md'
      - 'docs/THIRD-PARTY-NOTICES.md'
      - '!CLAUDE.md'
      - '!LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The consumer test publishes a browser app, as the samples' browser hosts are published.
      - name: Install the WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Build
        run: dotnet build Scribble.slnx -c Release

      # A hang killed by the timeout can still end in "Passed!" with only the finished tests counted, so the next
      # step fails the job if a hang dump was written.
      - name: Unit tests
        id: tests
        run: dotnet test tests/Scribble.Tests -c Release --no-build --blame-hang-timeout 5m --results-directory TestResults --logger trx

      # The log is shown only to signed-in users; annotations and the summary are public. This names each failed
      # test, with its message, in both.
      - name: Which tests failed
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        shell: pwsh
        run: ./.github/report-test-results.ps1 TestResults

      - name: No test run was aborted
        shell: pwsh
        run: |
          $dumps = Get-ChildItem TestResults -Recurse -Include *.dmp -ErrorAction SilentlyContinue
          if ($dumps) { $dumps | ForEach-Object { Write-Host $_.FullName }; throw "A test run was aborted (hang dump found)." }

      # Packs the 17 packages, then builds and publishes (NativeAOT, WebAssembly) apps that know Scribble only as
      # packages. --no-run: the apps aren't started, since a hosted runner has no GPU to count on; run the script
      # without it on a real machine before tagging a release.
      - name: Consumer test
        run: dotnet fsi tools/TestPackages.fsx --no-run

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  # The Gallery, in the browser, at https://timothythompson89.github.io/Scribble/ (docs/DESIGN.md, "The Gallery on
  # GitHub Pages"): published after the tests pass, for a push to main or a run started by hand on main. Never for a
  # pull request or another branch. Needs the repository's Pages source set to "GitHub Actions" (Settings, Pages).
  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write      # publishing the page
      id-token: write   # the deployment proves it comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deployment at a time; a newer push waits for the one running and then replaces it.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the WebAssembly tools
        run: dotnet workload install wasm-tools

      # WebAssembly AOT: a slow publish and a fast app, which is what a visitor judges.
      - name: Publish the Gallery
        run: dotnet publish samples/Gallery.Browser -c Release -p:BrowserAot=true -o artifacts/pages

      # How big the page is to download, in the run's summary (the .br files are what a browser is sent).
      - name: Size of the page
        shell: pwsh
        run: |
          $root = "artifacts/pages/wwwroot"
          if (-not (Test-Path "$root/index.html")) { throw "No index.html in $root." }
          $files = Get-ChildItem $root -Recurse -File
          $all = ($files | Measure-Object Length -Sum).Sum
          $plain = ($files | Where-Object { $_.Extension -notin ".br", ".gz" } | Measure-Object Length -Sum).Sum
          $br = ($files | Where-Object { $_.Extension -eq ".br" } | Measure-Object Length -Sum).Sum
          $line = "Gallery page: {0} files, {1:N1} MB on disk; {2:N1} MB uncompressed, {3:N1} MB as Brotli." -f $files.Count, ($all / 1MB), ($plain / 1MB), ($br / 1MB)
          Write-Host $line
          Add-Content $env:GITHUB_STEP_SUMMARY $line

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages/wwwroot

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
